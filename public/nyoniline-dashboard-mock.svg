<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 860" width="420" height="860" role="img" aria-labelledby="title desc">
  <title id="title">Nyoniline Dashboard on a phone</title>
  <desc id="desc">Mobile screen showing the Nyoniline poultry farming dashboard: greeting header, mortality/feed/weight stat cards, quick actions, a farming tip, and upcoming tasks.</desc>
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03724F"/>
      <stop offset="100%" stop-color="#0A2B21"/>
    </linearGradient>
    <filter id="phoneShadow" x="-30%" y="-10%" width="160%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#0A2B21" flood-opacity="0.28"/>
    </filter>
    <clipPath id="screenClip">
      <rect x="10" y="10" width="400" height="840" rx="46"/>
    </clipPath>
  </defs>

  <g font-family="Arial, Helvetica, sans-serif">

  <!-- Phone bezel -->
  <rect x="0" y="0" width="420" height="860" rx="54" fill="#0B1420" filter="url(#phoneShadow)"/>

  <!-- Screen -->
  <g clip-path="url(#screenClip)">
    <rect x="10" y="10" width="400" height="840" fill="#F4F9F5"/>

    <!-- Status bar -->
    <text x="34" y="46" font-size="15" font-weight="700" fill="#0A2B21">9:41</text>
    <g transform="translate(348,34)" fill="#0A2B21">
      <rect x="0" y="8" width="3" height="6" rx="1"/>
      <rect x="5" y="5" width="3" height="9" rx="1"/>
      <rect x="10" y="2" width="3" height="12" rx="1"/>
      <rect x="15" y="0" width="3" height="14" rx="1"/>
      <path d="M24 2 a8 8 0 0 1 8 8 h-2 a6 6 0 0 0 -6 -6 z" />
      <rect x="37" y="1" width="20" height="11" rx="2.5" fill="none" stroke="#0A2B21" stroke-width="1.3"/>
      <rect x="39" y="3" width="14" height="7" rx="1" fill="#0A2B21"/>
      <rect x="58" y="3.5" width="1.6" height="6" fill="#0A2B21"/>
    </g>

    <!-- Navbar -->
    <rect x="24" y="70" width="34" height="34" rx="10" fill="#059669"/>
    <path d="M32 92 C36 92 38 87 40 82 C42.5 76.5 45 71 51 68.5 C55 67 59 68 61.5 70" stroke="#F7F4EC" stroke-width="3.4" stroke-linecap="round" fill="none"/>
    <circle cx="61.5" cy="70" r="2.3" fill="#E8A93B"/>
    <text x="66" y="93" font-size="19" font-weight="700" fill="#0A2B21">Nyoniline</text>
    <circle cx="378" cy="87" r="16" fill="#FFFFFF" stroke="#E4D8C4" stroke-width="1"/>
    <path d="M378 79 a6.5 6.5 0 0 1 6.5 6.5 c0 4 1.5 5.5 2.5 6.5 h-18 c1 -1 2.5 -2.5 2.5 -6.5 a6.5 6.5 0 0 1 6.5 -6.5 z" fill="#0A2B21"/>
    <circle cx="384" cy="80" r="4" fill="#C2571A" stroke="#FFFFFF" stroke-width="1.5"/>

    <!-- Hero greeting card -->
    <rect x="24" y="120" width="372" height="108" rx="24" fill="url(#heroGrad)"/>
    <text x="46" y="158" font-size="20" font-weight="700" fill="#FBF3E7">Good morning, Bwalya</text>
    <text x="46" y="182" font-size="13" fill="#BFE3D2">4 active batches &#183; 2,840 birds tracked</text>
    <rect x="46" y="196" width="200" height="8" rx="4" fill="#0A2B21" opacity="0.35"/>
    <rect x="46" y="196" width="152" height="8" rx="4" fill="#E8A93B"/>
    <text x="46" y="219" font-size="11" fill="#9FCBB6">Batch 3 &#183; 76% to market weight</text>
    <g transform="translate(324,140)">
      <rect x="0" y="0" width="52" height="52" rx="16" fill="#E8A93B"/>
      <circle cx="26" cy="20" r="9" fill="#FBF3E7"/>
      <g stroke="#FBF3E7" stroke-width="2.4" stroke-linecap="round">
        <line x1="26" y1="4" x2="26" y2="8"/>
        <line x1="26" y1="32" x2="26" y2="36"/>
        <line x1="10" y1="20" x2="14" y2="20"/>
        <line x1="38" y1="20" x2="42" y2="20"/>
      </g>
      <text x="26" y="46" font-size="10" font-weight="700" fill="#4A2C05" text-anchor="middle">27&#176;C</text>
    </g>

    <!-- Stat cards -->
    <g>
      <rect x="24" y="248" width="115" height="98" rx="18" fill="#FDEBE7" stroke="#FADCD5"/>
      <circle cx="46" cy="272" r="14" fill="#F4A89A"/>
      <path d="M46 265 v7" stroke="#7A2818" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="46" cy="277.5" r="1.4" fill="#7A2818"/>
      <text x="38" y="308" font-size="22" font-weight="800" fill="#0A2B21">03</text>
      <text x="38" y="326" font-size="10.5" fill="#7A4438">Mortality today</text>
    </g>
    <g>
      <rect x="147" y="248" width="115" height="98" rx="18" fill="#E7F6EF" stroke="#D7F2E4"/>
      <circle cx="169" cy="272" r="14" fill="#7DD1AA"/>
      <path d="M163 275 q6 -12 12 0" stroke="#03724F" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <text x="161" y="308" font-size="22" font-weight="800" fill="#0A2B21">4d</text>
      <text x="161" y="326" font-size="10.5" fill="#3E4F48">Feed left</text>
    </g>
    <g>
      <rect x="270" y="248" width="126" height="98" rx="18" fill="#E7F6EF" stroke="#D7F2E4"/>
      <circle cx="292" cy="272" r="14" fill="#7DD1AA"/>
      <path d="M286 278 l4 -10 l4 6 l4 -12" stroke="#03724F" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="284" y="308" font-size="22" font-weight="800" fill="#0A2B21">1.8kg</text>
      <text x="284" y="326" font-size="10.5" fill="#3E4F48">Avg weight</text>
    </g>

    <!-- Quick actions -->
    <text x="24" y="372" font-size="14" font-weight="700" fill="#0A2B21">Quick actions</text>
    <g>
      <rect x="24" y="384" width="181" height="76" rx="18" fill="#FDF4E4" stroke="#FBE7C3"/>
      <circle cx="48" cy="422" r="16" fill="#F6D293"/>
      <path d="M40 422 a8 8 0 1 1 16 0 a8 8 0 0 1 -16 0" fill="none" stroke="#4A2C05" stroke-width="2"/>
      <text x="72" y="418" font-size="13" font-weight="700" fill="#0A2B21">Check a bird</text>
      <text x="72" y="434" font-size="10.5" fill="#7A5B2E">AI symptom check</text>
    </g>
    <g>
      <rect x="215" y="384" width="181" height="76" rx="18" fill="#E7F6EF" stroke="#D7F2E4"/>
      <circle cx="239" cy="422" r="16" fill="#AFE4C9"/>
      <path d="M232 422 l5 5 l10 -11" stroke="#03724F" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="263" y="418" font-size="13" font-weight="700" fill="#0A2B21">Log today</text>
      <text x="263" y="434" font-size="10.5" fill="#3E4F48">Feed &#183; water &#183; deaths</text>
    </g>

    <!-- Today's tip -->
    <rect x="24" y="474" width="372" height="80" rx="16" fill="#FFFFFF" stroke="#ECE8DC"/>
    <rect x="24" y="474" width="5" height="80" rx="2.5" fill="#E8A93B"/>
    <rect x="44" y="490" width="58" height="18" rx="9" fill="#FBE7C3"/>
    <text x="53" y="503" font-size="9.5" font-weight="700" fill="#4A2C05">TODAY&#8217;S TIP</text>
    <text x="44" y="524" font-size="12.5" fill="#0A2B21">Raise brooder temperature 2&#176;C tonight &#8212;</text>
    <text x="44" y="540" font-size="12.5" fill="#0A2B21">cold snap expected before sunrise.</text>

    <!-- Coming up -->
    <text x="24" y="580" font-size="14" font-weight="700" fill="#0A2B21">Coming up</text>
    <rect x="24" y="592" width="372" height="64" rx="16" fill="#FFFFFF" stroke="#ECE8DC"/>
    <circle cx="50" cy="624" r="15" fill="#E7F6EF"/>
    <path d="M50 615 v10 l7 4" stroke="#03724F" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <text x="76" y="620" font-size="12.5" font-weight="700" fill="#0A2B21">Newcastle booster &#8211; Batch 4</text>
    <text x="76" y="637" font-size="11" fill="#5B6B64">Due in 2 days</text>
    <path d="M380 618 l7 6 l-7 6" stroke="#5B6B64" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="24" y="664" width="372" height="64" rx="16" fill="#FFFFFF" stroke="#ECE8DC"/>
    <circle cx="50" cy="696" r="15" fill="#FDF4E4"/>
    <path d="M44 696 h12 M50 690 v12" stroke="#C2571A" stroke-width="2.2" stroke-linecap="round"/>
    <text x="76" y="692" font-size="12.5" font-weight="700" fill="#0A2B21">Feed order &#8211; 3 bags maize bran</text>
    <text x="76" y="709" font-size="11" fill="#5B6B64">Arriving tomorrow</text>
    <path d="M380 690 l7 6 l-7 6" stroke="#5B6B64" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Bottom nav -->
    <rect x="10" y="768" width="400" height="82" fill="#FFFFFF" opacity="0.97"/>
    <line x1="10" y1="768" x2="410" y2="768" stroke="#ECE8DC"/>
    <g>
      <rect x="42" y="782" width="60" height="30" rx="15" fill="#03724F"/>
      <path d="M62 802 v-10 l10 -8 l10 8 v10 h-6 v-7 h-8 v7 z" fill="#F7F4EC" transform="scale(0.62) translate(38,26)"/>
      <text x="72" y="801" font-size="9.5" font-weight="700" fill="#F7F4EC" text-anchor="middle">Home</text>
    </g>
    <g fill="#8A968F" text-anchor="middle" font-size="9.5">
      <circle cx="158" cy="797" r="10" fill="none" stroke="#8A968F" stroke-width="1.6"/>
      <text x="158" y="822">Flock</text>
      <rect x="196" y="787" width="20" height="16" rx="3" fill="none" stroke="#8A968F" stroke-width="1.6"/>
      <text x="243" y="822">Market</text>
      <path d="M320 788 l8 9 l-8 9 l-8 -9 z" fill="none" stroke="#8A968F" stroke-width="1.6"/>
      <text x="320" y="822">Vaccines</text>
      <circle cx="378" cy="792" r="2" fill="#8A968F"/>
      <circle cx="378" cy="798" r="2" fill="#8A968F"/>
      <circle cx="378" cy="804" r="2" fill="#8A968F"/>
      <text x="378" y="822">More</text>
    </g>
  </g>

  <!-- Phone frame highlight -->
  <rect x="10" y="10" width="400" height="840" rx="46" fill="none" stroke="#1C2B3A" stroke-width="2"/>
  <rect x="164" y="22" width="92" height="26" rx="13" fill="#0B1420"/>

  </g>
</svg>
